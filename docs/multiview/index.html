<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Multiview</title>
<link rel="icon" id="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23fff'%3E%3Crect x='1' y='2' width='6' height='5' rx='1.5'/%3E%3Crect x='9' y='2' width='6' height='5' rx='1.5'/%3E%3Crect x='1' y='9' width='6' height='5' rx='1.5'/%3E%3Crect x='9' y='9' width='6' height='5' rx='1.5'/%3E%3C/svg%3E">
<style>
  :root {
    --gap: 8px;
    --radius: 12px;
    --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
    color-scheme: dark;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #101012;
    color: #fff;
    font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  }

  #wall {
    position: absolute;
    inset: var(--gap);
  }

  /* Placed by layout(); moving between layouts glides rather than jumps. */
  .tile {
    position: absolute;
    overflow: hidden;
    border-radius: var(--radius);
    background: #000;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: box-shadow 160ms ease, opacity 160ms ease;
    animation: tile-in 260ms var(--ease);
  }

  #wall.gliding .tile {
    transition: box-shadow 160ms ease, opacity 160ms ease, left 300ms var(--ease), top 300ms var(--ease),
      width 300ms var(--ease), height 300ms var(--ease);
  }

  .pill[hidden] {
    display: none;
  }

  .pill.active {
    background: #fff;
    color: #000;
  }

  @keyframes tile-in {
    from { opacity: 0; scale: 0.96; }
  }

  .tile[sound] {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
  }

  .tile.drop-target {
    box-shadow: 0 0 0 2px rgb(10, 132, 255);
  }

  .tile.dragging {
    opacity: 0.4;
  }

  .player,
  .player > iframe,
  .player > video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .player > video {
    background: #000;
    object-fit: contain;
  }

  /* While a tile is dragged, the players mustn't swallow the drag. */
  body.dragging .player {
    pointer-events: none;
  }

  /* The bar along the top of a tile, on hover */
  .bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 150ms ease, visibility 0s 150ms;
  }

  /* Hidden, not just see-through, when not hovered: some players (Twitch)
   * pause when something sits on top of them. */
  .tile:hover .bar,
  .tile:focus-within .bar,
  body.dragging .bar {
    opacity: 1;
    visibility: visible;
    transition: opacity 90ms ease, visibility 0s;
  }

  .bar > * {
    pointer-events: auto;
  }

  .label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }

  .pill {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 27px;
    min-width: 27px;
    padding: 0 8px;
    border: 0;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  .pill:hover,
  .pill:focus-visible {
    background: rgba(255, 255, 255, 0.32);
    outline: none;
  }

  .pill svg {
    width: 14px;
    height: 14px;
    flex: none;
  }

  .handle {
    cursor: grab;
  }

  .handle:active {
    cursor: grabbing;
  }

  .tile[sound] .sound {
    background: #fff;
    color: #000;
  }

  /* "Stream ended" / "Ended" */
  .ended {
    position: absolute;
    left: 50%;
    bottom: 14px;
    z-index: 2;
    translate: -50% 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.7);
    white-space: nowrap;
    pointer-events: none;
  }

  .ended[hidden] {
    display: none;
  }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
  }

  #empty strong {
    color: #fff;
    font-size: 17px;
    font-weight: 600;
  }

  #empty[hidden] {
    display: none;
  }
</style>
</head>
<body>
<div id="wall"></div>
<div id="empty" hidden>
  <strong>Multiview</strong>
  <span>Right-click a video, its page or its tab and choose <b>Add to Multiview</b>.<br>
  Up to four at a time, from YouTube, Twitch, Kick, Vimeo, Dailymotion or video files, live streams included.</span>
</div>
<script>
(() => {
  "use strict";

  const wall = document.getElementById("wall");
  const empty = document.getElementById("empty");
  const HOST = location.hostname || "localhost";
  const icon = (body) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const ICONS = {
    handle: icon('<circle cx="6" cy="4" r=".6"/><circle cx="10" cy="4" r=".6"/><circle cx="6" cy="8" r=".6"/><circle cx="10" cy="8" r=".6"/><circle cx="6" cy="12" r=".6"/><circle cx="10" cy="12" r=".6"/>'),
    muted: icon('<path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" fill="currentColor"/><path d="M11 6.2l3.4 3.6M14.4 6.2L11 9.8"/>'),
    sound: icon('<path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" fill="currentColor"/><path d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.8a6 6 0 0 1 0 8.4"/>'),
    bigger: icon('<path d="M9.5 2.5h4v4M13.5 2.5L9 7M6.5 13.5h-4v-4M2.5 13.5L7 9"/>'),
    smaller: icon('<path d="M13.5 6.5h-4v-4M9.5 6.5l4-4M2.5 9.5h4v4M6.5 9.5l-4 4"/>'),
    side: icon('<rect x="1.5" y="4" width="5.5" height="8" rx="1.2"/><rect x="9" y="4" width="5.5" height="8" rx="1.2"/>'),
    stacked: icon('<rect x="3" y="1.5" width="10" height="5.5" rx="1.2"/><rect x="3" y="9" width="10" height="5.5" rx="1.2"/>'),
    open: icon('<path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/>'),
    close: icon('<path d="M4 4l8 8M12 4l-8 8"/>'),
  };

  // ---------- The address holds the videos: #~colour,kind:id@seconds;title,...
  // (the colour, from Zia, fills the tab's grid icon). Four at most.
  const MAX = 4;
  const ZIA_BLUE = "5ab9f5";
  let color = ZIA_BLUE;

  function readEntries() {
    const items = (location.hash.slice(1) || "").split(",").filter(Boolean);
    const token = items.find((item) => item.startsWith("~"));
    color = /^~[0-9a-f]{6}$/i.test(token || "") ? token.slice(1) : ZIA_BLUE;
    return items
      .filter((item) => !item.startsWith("~"))
      .map((item) => {
        const [body, title] = item.split(";");
        const [head, at] = body.split("@");
        const [kind, id] = head.split(":");
        return kind && id
          ? { kind, id: decodeURIComponent(id), at: Number(at) || 0, title: title ? decodeURIComponent(title) : "" }
          : null;
      })
      .filter((entry) => entry && KINDS[entry.kind])
      .slice(0, MAX);
  }

  function writeEntries() {
    const items = order.map((key) => {
      const { kind, id, at, title } = tiles.get(key).entry;
      return `${kind}:${encodeURIComponent(id)}${at ? `@${Math.floor(at)}` : ""}${title ? `;${encodeURIComponent(title)}` : ""}`;
    });
    history.replaceState(null, "", `#${[`~${color}`, ...items].join(",")}`);
  }

  const keyOf = (entry) => `${entry.kind}:${entry.id}`;

  // ---------- One player per kind of site
  const hms = (s) => `${Math.floor(s / 3600)}h${Math.floor((s % 3600) / 60)}m${Math.floor(s % 60)}s`;

  function iframe(src) {
    const frame = document.createElement("iframe");
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.src = src;
    return frame;
  }

  // Players without a mute API start muted and reload to switch sound on.
  function reloading(makeSrc) {
    return (tile) => {
      const frame = iframe(makeSrc(true));
      tile.player.append(frame);
      return {
        mute(muted) {
          frame.src = makeSrc(muted);
        },
      };
    };
  }

  const KINDS = {
    yt: {
      source: ({ id, at }) => `https://www.youtube.com/watch?v=${id}${at ? `&t=${at}s` : ""}`,
      label: () => "YouTube",
      make(tile) {
        const { id, at } = tile.entry;
        const frame = iframe(
          `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1` +
            `&origin=${encodeURIComponent(location.origin)}${at ? `&start=${Math.floor(at)}` : ""}`
        );
        tile.player.append(frame);
        const send = (message) => frame.contentWindow?.postMessage(JSON.stringify(message), "https://www.youtube.com");
        // Ask the player for its state (for "Ended"); it answers once ready.
        let listening = 0;
        const listen = setInterval(() => {
          send({ event: "listening", id: tile.key, channel: "widget" });
          if (++listening > 20) {
            clearInterval(listen);
          }
        }, 500);
        tile.onMessage = (origin, data) => {
          if (!origin.endsWith("youtube.com") || typeof data !== "string") {
            return false;
          }
          let message;
          try {
            message = JSON.parse(data);
          } catch (err) {
            return false;
          }
          if (message.id !== tile.key) {
            return false;
          }
          clearInterval(listen);
          const state = message.info?.playerState;
          if (state === 0) {
            tile.showEnded("Ended");
          } else if (state === 1) {
            tile.showEnded(null);
          }
          return true;
        };
        return {
          mute(muted) {
            const command = (func, args = []) => send({ event: "command", func, args });
            command(muted ? "mute" : "unMute");
            if (!muted) {
              command("setVolume", [100]);
            }
          },
        };
      },
    },
    // Twitch and Kick: their plain embeds. Twitch's scripted player pauses
    // itself after a few seconds when it decides it isn't fully visible.
    tw: {
      source: ({ id }) => `https://www.twitch.tv/${id}`,
      label: ({ id }) => `twitch.tv/${id}`,
      make: (tile) =>
        reloading((muted) => `https://player.twitch.tv/?channel=${encodeURIComponent(tile.entry.id)}&parent=${HOST}&autoplay=true&muted=${muted}`)(tile),
    },
    twv: {
      source: ({ id, at }) => `https://www.twitch.tv/videos/${id}${at ? `?t=${hms(at)}` : ""}`,
      label: () => "Twitch video",
      make: (tile) =>
        reloading(
          (muted) =>
            `https://player.twitch.tv/?video=v${encodeURIComponent(tile.entry.id)}&time=${hms(tile.entry.at || 0)}&parent=${HOST}&autoplay=true&muted=${muted}`
        )(tile),
    },
    twc: {
      source: ({ id }) => `https://clips.twitch.tv/${id}`,
      label: () => "Twitch clip",
      make: (tile) =>
        reloading((muted) => `https://clips.twitch.tv/embed?clip=${encodeURIComponent(tile.entry.id)}&parent=${HOST}&autoplay=true&muted=${muted}`)(tile),
    },
    kick: {
      source: ({ id }) => `https://kick.com/${id}`,
      label: ({ id }) => `kick.com/${id}`,
      make: (tile) => reloading((muted) => `https://player.kick.com/${encodeURIComponent(tile.entry.id)}?autoplay=true&muted=${muted}`)(tile),
    },
    vm: {
      source: ({ id, at }) => `https://vimeo.com/${id}${at ? `#t=${at}s` : ""}`,
      label: () => "Vimeo",
      make(tile) {
        const { id, at } = tile.entry;
        const frame = iframe(`https://player.vimeo.com/video/${encodeURIComponent(id)}?autoplay=1&muted=1&dnt=1${at ? `#t=${Math.floor(at)}s` : ""}`);
        tile.player.append(frame);
        const send = (message) => frame.contentWindow?.postMessage(JSON.stringify(message), "https://player.vimeo.com");
        frame.addEventListener("load", () => send({ method: "addEventListener", value: "ended" }));
        tile.onMessage = (origin, data) => {
          if (origin !== "https://player.vimeo.com" || frame.contentWindow !== tile.lastSource) {
            return false;
          }
          try {
            const message = typeof data === "string" ? JSON.parse(data) : data;
            if (message.event === "ended") {
              tile.showEnded("Ended");
            }
          } catch (err) {}
          return true;
        };
        return {
          mute(muted) {
            send({ method: "setMuted", value: muted });
            if (!muted) {
              send({ method: "setVolume", value: 1 });
            }
          },
        };
      },
    },
    dm: {
      source: ({ id }) => `https://www.dailymotion.com/video/${id}`,
      label: () => "Dailymotion",
      make: (tile) =>
        reloading(
          (muted) =>
            `https://www.dailymotion.com/embed/video/${encodeURIComponent(tile.entry.id)}?autoplay=1&mute=${muted ? 1 : 0}` +
            (tile.entry.at ? `&start=${Math.floor(tile.entry.at)}` : "")
        )(tile),
    },
    file: {
      source: ({ id }) => id,
      label: ({ id }) => {
        try {
          return new URL(id).hostname.replace(/^www\./, "");
        } catch (err) {
          return "Video";
        }
      },
      make(tile) {
        const video = document.createElement("video");
        video.src = tile.entry.id;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.controls = true;
        video.addEventListener("loadedmetadata", () => {
          if (tile.entry.at && Number.isFinite(video.duration)) {
            video.currentTime = tile.entry.at;
          }
        }, { once: true });
        video.addEventListener("ended", () => tile.showEnded("Ended"));
        video.addEventListener("play", () => tile.showEnded(null));
        video.addEventListener("error", () => tile.showEnded("Can't play this video here"));
        tile.player.append(video);
        return {
          mute(muted) {
            video.muted = muted;
            if (!muted) {
              video.volume = 1;
            }
          },
        };
      },
    },
  };

  // ---------- Tiles
  const tiles = new Map();
  let order = [];
  let soundKey = null;
  let dragKey = null;

  function makeTile(entry) {
    const key = keyOf(entry);
    const kind = KINDS[entry.kind];
    const el = document.createElement("div");
    el.className = "tile";
    el.innerHTML = `
      <div class="player"></div>
      <div class="bar">
        <button class="pill handle" draggable="true" title="Drag to move">${ICONS.handle}</button>
        <span class="label"></span>
        <button class="pill pair" title="Side by side">${ICONS.side}</button>
        <button class="pill focus" title="Make this one bigger">${ICONS.bigger}</button>
        <button class="pill sound" title="Play this one's sound">${ICONS.muted}</button>
        <a class="pill open" target="_blank" rel="noopener" title="Open on the site">${ICONS.open}</a>
        <button class="pill remove" title="Remove">${ICONS.close}</button>
      </div>
      <div class="ended" hidden></div>`;
    const tile = {
      key,
      entry,
      el,
      player: el.querySelector(".player"),
      onMessage: null,
      lastSource: null,
      showEnded(text) {
        const label = el.querySelector(".ended");
        label.hidden = !text;
        label.textContent = text || "";
      },
    };
    // The video's title where Zia passed one, else the site
    const label = el.querySelector(".label");
    label.textContent = entry.title || kind.label(entry);
    label.title = entry.title ? `${entry.title} — ${kind.label(entry)}` : kind.label(entry);
    el.querySelector(".open").href = kind.source(entry);
    el.querySelector(".sound").addEventListener("click", () => setSound(soundKey === key ? null : key));
    el.querySelector(".remove").addEventListener("click", () => removeTile(key));
    el.querySelector(".focus").addEventListener("click", () => {
      prefs.focus = prefs.focus === key ? null : key;
      savePrefs();
      glide();
    });
    el.querySelector(".pair").addEventListener("click", () => {
      prefs.pair = currentPair === "side" ? "stacked" : "side";
      savePrefs();
      glide();
    });

    const handle = el.querySelector(".handle");
    handle.addEventListener("dragstart", (event) => {
      dragKey = key;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", key);
      event.dataTransfer.setDragImage(el, 20, 20);
      document.body.classList.add("dragging");
      el.classList.add("dragging");
    });
    handle.addEventListener("dragend", () => {
      dragKey = null;
      document.body.classList.remove("dragging");
      for (const t of tiles.values()) {
        t.el.classList.remove("dragging", "drop-target");
      }
    });
    el.addEventListener("dragover", (event) => {
      if (dragKey && dragKey !== key) {
        event.preventDefault();
        el.classList.add("drop-target");
      }
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-target"));
    el.addEventListener("drop", (event) => {
      event.preventDefault();
      el.classList.remove("drop-target");
      if (!dragKey || dragKey === key) {
        return;
      }
      // Take the dropped-on tile's place.
      const from = order.indexOf(dragKey);
      const to = order.indexOf(key);
      order.splice(from, 1);
      order.splice(to, 0, dragKey);
      applyOrder();
      writeEntries();
    });

    Object.assign(tile, kind.make(tile));
    return tile;
  }

  function setSound(key) {
    soundKey = key;
    for (const tile of tiles.values()) {
      const on = tile.key === key;
      const was = tile.el.hasAttribute("sound");
      tile.el.toggleAttribute("sound", on);
      tile.el.querySelector(".sound").innerHTML = on ? ICONS.sound : ICONS.muted;
      tile.el.querySelector(".sound").title = on ? "Mute" : "Play this one's sound";
      if (on !== was) {
        tile.mute?.(!on);
      }
    }
  }

  function removeTile(key) {
    const tile = tiles.get(key);
    if (!tile) {
      return;
    }
    tile.el.remove();
    tiles.delete(key);
    order = order.filter((k) => k !== key);
    if (soundKey === key) {
      soundKey = null;
    }
    writeEntries();
    refresh();
  }

  function applyOrder() {
    glide();
  }

  // Moving an iframe in the page reloads it, so tiles are only ever added or
  // removed; their order is CSS.
  function sync() {
    const entries = readEntries();
    const keys = entries.map(keyOf);
    for (const key of [...tiles.keys()]) {
      if (!keys.includes(key)) {
        tiles.get(key).el.remove();
        tiles.delete(key);
        if (soundKey === key) {
          soundKey = null;
        }
      }
    }
    for (const entry of entries) {
      const key = keyOf(entry);
      if (!tiles.has(key)) {
        const tile = makeTile(entry);
        tiles.set(key, tile);
        wall.append(tile.el);
      }
    }
    order = keys.filter((key, i) => keys.indexOf(key) === i);
    applyOrder();
    refresh();
  }

  // ---------- Layouts. Remembered in this browser (not in the address):
  //  - grid: as many columns as make the tiles biggest, 16:9, with a
  //    part-filled last row centred
  //  - two videos: side by side or stacked, as picked on a tile (until then,
  //    whichever makes them bigger)
  //  - one tile bigger: the rest in a row below it, or in a column beside it
  //    when that leaves the big one bigger
  const PREFS_KEY = "zia-multiview-layout";
  let prefs = { pair: "auto", focus: null };
  try {
    prefs = { ...prefs, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") };
  } catch (err) {}
  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    } catch (err) {}
  }
  let currentPair = null;

  const GAP = 8;
  const fit = (w, h) => (w / h > 16 / 9 ? [(h * 16) / 9, h] : [w, (w * 9) / 16]);

  function gridSize(n, cols, width, height) {
    const rows = Math.ceil(n / cols);
    return fit((width - GAP * (cols - 1)) / cols, (height - GAP * (rows - 1)) / rows);
  }

  // Rows of equal tiles, each row centred, the block centred.
  function placeGrid(keys, cols, w, h, width, height) {
    const rows = Math.ceil(keys.length / cols);
    const top = (height - (rows * h + GAP * (rows - 1))) / 2;
    const spots = [];
    keys.forEach((key, i) => {
      const row = Math.floor(i / cols);
      const inRow = Math.min(cols, keys.length - row * cols);
      const left = (width - (inRow * w + GAP * (inRow - 1))) / 2;
      spots.push([key, left + (i % cols) * (w + GAP), top + row * (h + GAP), w, h]);
    });
    return spots;
  }

  function placeFocus(big, rest, width, height) {
    const m = rest.length;
    // Below: a row of small tiles about a quarter of the height
    let sh = Math.min(Math.max(height * 0.24, 70), 260);
    let sw = (sh * 16) / 9;
    if (m * sw + GAP * (m - 1) > width) {
      sw = (width - GAP * (m - 1)) / m;
      sh = (sw * 9) / 16;
    }
    const [bw1, bh1] = fit(width, height - GAP - sh);
    // Beside: a column of small tiles about a quarter of the width
    let cw = Math.min(Math.max(width * 0.24, 120), 460);
    let ch = (cw * 9) / 16;
    if (m * ch + GAP * (m - 1) > height) {
      ch = (height - GAP * (m - 1)) / m;
      cw = (ch * 16) / 9;
    }
    const [bw2, bh2] = fit(width - GAP - cw, height);

    const spots = [];
    if (bw1 >= bw2) {
      const top = (height - (bh1 + GAP + sh)) / 2;
      spots.push([big, (width - bw1) / 2, top, bw1, bh1]);
      const left = (width - (m * sw + GAP * (m - 1))) / 2;
      rest.forEach((key, i) => spots.push([key, left + i * (sw + GAP), top + bh1 + GAP, sw, sh]));
    } else {
      const left = (width - (bw2 + GAP + cw)) / 2;
      spots.push([big, left, (height - bh2) / 2, bw2, bh2]);
      const top = (height - (m * ch + GAP * (m - 1))) / 2;
      rest.forEach((key, i) => spots.push([key, left + bw2 + GAP, top + i * (ch + GAP), cw, ch]));
    }
    return spots;
  }

  function layout() {
    const n = order.length;
    const width = wall.clientWidth;
    const height = wall.clientHeight;
    if (!n || !width || !height) {
      return;
    }
    const focus = n > 1 && order.includes(prefs.focus) ? prefs.focus : null;
    let spots;
    currentPair = null;
    if (focus) {
      spots = placeFocus(focus, order.filter((key) => key !== focus), width, height);
    } else if (n === 2) {
      const [sw, sh] = gridSize(2, 2, width, height);
      const [tw, th] = gridSize(2, 1, width, height);
      currentPair = prefs.pair === "side" || prefs.pair === "stacked" ? prefs.pair : sw >= tw ? "side" : "stacked";
      spots = currentPair === "side" ? placeGrid(order, 2, sw, sh, width, height) : placeGrid(order, 1, tw, th, width, height);
    } else {
      let best = { cols: 1, w: 0, h: 0 };
      for (let cols = 1; cols <= n; cols++) {
        const [w, h] = gridSize(n, cols, width, height);
        if (w > best.w) {
          best = { cols, w, h };
        }
      }
      spots = placeGrid(order, best.cols, best.w, best.h, width, height);
    }
    for (const [key, left, top, w, h] of spots) {
      const tile = tiles.get(key);
      Object.assign(tile.el.style, {
        left: `${Math.round(left)}px`,
        top: `${Math.round(top)}px`,
        width: `${Math.floor(w)}px`,
        height: `${Math.floor(h)}px`,
      });
      const isFocus = key === focus;
      const focusButton = tile.el.querySelector(".focus");
      focusButton.innerHTML = isFocus ? ICONS.smaller : ICONS.bigger;
      focusButton.title = isFocus ? "Back to the grid" : "Make this one bigger";
      focusButton.hidden = n < 2;
      const pairButton = tile.el.querySelector(".pair");
      pairButton.hidden = !currentPair;
      pairButton.innerHTML = currentPair === "side" ? ICONS.stacked : ICONS.side;
      pairButton.title = currentPair === "side" ? "Stack them" : "Side by side";
    }
  }

  // Layout changes the user asks for glide; resizing the window doesn't.
  let glideTimer = 0;
  function glide() {
    wall.classList.add("gliding");
    layout();
    clearTimeout(glideTimer);
    glideTimer = setTimeout(() => wall.classList.remove("gliding"), 350);
  }

  // The tab's icon: a 2×2 grid of faint white squares, one coloured in per video.
  function drawIcon() {
    const spots = [[1, 2], [9, 2], [1, 9], [9, 9]];
    const squares = spots
      .map(([x, y], i) =>
        i < order.length
          ? `<rect x="${x}" y="${y}" width="6" height="5" rx="1.5" fill="#${color}"/>`
          : `<rect x="${x}" y="${y}" width="6" height="5" rx="1.5" fill="#fff" fill-opacity="0.35"/>`
      )
      .join("");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">${squares}</svg>`;
    document.getElementById("icon").href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
  }

  function refresh() {
    drawIcon();
    empty.hidden = order.length > 0;
    document.title = order.length ? `Multiview · ${order.length}` : "Multiview";
    layout();
  }

  window.addEventListener("message", (event) => {
    for (const tile of tiles.values()) {
      const frame = tile.player.querySelector("iframe");
      if (frame && frame.contentWindow === event.source) {
        tile.lastSource = event.source;
        tile.onMessage?.(event.origin, event.data);
        return;
      }
    }
  });
  window.addEventListener("hashchange", sync);
  new ResizeObserver(layout).observe(wall);
  sync();
})();
</script>
</body>
</html>
