<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="context-fill">
  <style>
    rect { transform-box: fill-box; transform-origin: center; animation: zia-bar 0.6s ease-in-out infinite alternate; }
    .b1 { animation-duration: 0.55s; animation-delay: -0.2s; }
    .b2 { animation-duration: 0.68s; animation-delay: -0.5s; }
    .b3 { animation-duration: 0.5s; animation-delay: -0.3s; }
    @keyframes zia-bar { from { transform: scaleY(0.22); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      rect { animation: none; }
      .b1 { transform: scaleY(0.6); } .b2 { transform: scaleY(1); } .b3 { transform: scaleY(0.45); }
    }
  </style>
  <rect class="b1" x="3.3" y="2.5" width="2.4" height="11" rx="1.2"/>
  <rect class="b2" x="6.8" y="2.5" width="2.4" height="11" rx="1.2"/>
  <rect class="b3" x="10.3" y="2.5" width="2.4" height="11" rx="1.2"/>
</svg>
