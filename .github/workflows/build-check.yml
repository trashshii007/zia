name: Build check

# zia.uc.js and chrome.css are built from src/. This fails if they've been
# edited directly, or src/ changed without rebuilding.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh --check
